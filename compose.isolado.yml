services:
  banco:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Defina MSSQL_SA_PASSWORD}
      MSSQL_MEMORY_LIMIT_MB: '1536'
    volumes:
      - dados-caderneta:/var/opt/mssql
    networks: [caderneta]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
  app:
    build: .
    environment:
      PORT: '3000'
      DB_SERVER: banco
      DB_PORT: '1433'
      DB_NAME: CadernetaDigital
      DB_USER: app_caderneta
      DB_PASSWORD: 'Caderneta@A3_2026'
      DB_ENCRYPT: 'false'
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET}
      CORS_ORIGINS: http://localhost:3003
    ports:
      - '127.0.0.1:3003:3000'
    networks: [caderneta]
    depends_on: [banco]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
networks:
  caderneta:
    internal: true
volumes:
  dados-caderneta:
